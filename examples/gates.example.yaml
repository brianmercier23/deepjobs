# The free stage. Everything here runs on regex over text already in hand and
# costs nothing, which is the point: it is what stops you paying an LLM to read
# two thousand postings that were never viable.
#
# `deepjobs init` copies this to config/gates.yaml, which is gitignored.
#
# The bias is deliberately toward letting things through. A gate that silently
# rejects a good role costs more than one that passes a bad role: the bad one
# dies for a fraction of a cent at the next stage, while the good one is never
# seen again. Most settings below produce a flag rather than a rejection.

location:
  # Used in reject reasons, so write it to read as a sentence:
  # "onsite outside the Denver metro: Austin, TX".
  home_metro_label: "the Denver metro"

  # Lets a metro entry with no state still match when the posting names the
  # state, e.g. "Boulder" matching "Boulder, Colorado".
  home_state: colorado
  home_state_code: co

  # Onsite roles survive only in these. Remote is judged separately.
  onsite_metros_allowed:
    - denver
    - boulder
    - aurora
    - lakewood

  # A posting whose location says nothing useful ("Multiple locations",
  # "Nationwide") passes with a LOCATION_UNKNOWN flag rather than being
  # guessed at. Set false to reject instead.
  pass_ambiguous_locations: true

  reject_if_relocation_required: true

  # Rejects only when there is no US signal AND the location names a country
  # on the known-foreign list. An incomplete list therefore degrades to a flag,
  # never to a wrong rejection.
  reject_non_us: true

  # Read the body before believing a remote flag. Boards let an employer tick
  # "remote" and then write a description requiring three days a week in San
  # Francisco, and structured metadata is what every other job tool filters
  # on, so those postings pass every filter. Costs nothing and flags them as
  # REMOTE_CONTRADICTED.
  check_remote_claim_against_body: true

  # Turn the flag into a rejection. Off by default: a hybrid role inside your
  # own metro is still a job you might want.
  reject_contradicted_remote: false

compensation:
  # Flags below this, does not reject. A posting stating no salary is never
  # rejected on comp; most postings state none at all.
  soft_floor: 95000

  # A hard floor that does reject. Leave null unless you mean it.
  min_annual: null

  reject_commission_only: true
  reject_unpaid: true

employment_type:
  # flag | reject
  contract_mode: flag

hard_rejects:
  # Word-boundary matched, so "intern" cannot kill "Internal Audit Manager".
  titles_containing:
    - intern
    - internship
    - volunteer
    - apprentice
    - vice president
    - chief

  # Same matching, applied to the title and body together. Empty by default:
  # this list is the easiest way to make the gate quietly too tight.
  description_containing: []

staffing_agencies:
  # flag | reject. Flagged by default, because agencies do carry real roles.
  mode: flag
  names:
    - Robert Half
    - Aerotek
    - TEKsystems
    - Insight Global
    - Randstad
    - Kforce
