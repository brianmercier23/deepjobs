# The one keyword file that ships tracked and working, because it is not
# personal and it is the whole differentiator.
#
# Applied by regex at ingest, word-boundary matched, before anything is paid
# for. Costs nothing and runs on every posting.
#
# Why it exists: what a posting names is what a team actually builds with, and
# a title never says. `forward` is the tooling of a team that ships with modern
# AI; `legacy` is the tooling of one that does not.
#
# What this is NOT: a score. Measured over 100 gate-passing postings, the tag
# moves build latitude by about 2 points of 15 and barely moves the total, and
# legacy-tagged postings scored slightly higher than forward-tagged ones on a
# rubric written for an operations candidate. An earlier note here claimed a
# 65-81 versus 25-40 split; that was a hypothesis and it did not survive
# measurement. See docs/verification.md.
#
# Treat a forward tag as "worth reading", which it is, and for free. Extend
# both lists; they are meant to be edited.

forward:
  agents:
    - claude
    - claude code
    - agent sdk
    - agentic
    - agentic workflow
    - ai agent
    - autonomous agent
    - tool use
    - mcp
    - model context protocol
  retrieval:
    - rag
    - retrieval augmented generation
    - vector search
    - vector database
    - embeddings
    - semantic search
  platform:
    - langchain
    - llamaindex
    - openai api
    - anthropic
    - fine-tuning
    - prompt engineering
    - llm
    - large language model
  practice:
    - ai adoption
    - ai enablement
    - internal tooling
    - process automation
    - workflow automation

legacy:
  # Not a reject list. A posting can name these and still be worth reading.
  # It is a counterweight: heavy legacy vocabulary with no forward terms is a
  # strong predictor of a role that is administering software, not building.
  training:
    - addie
    # Product names, not the bare word. "articulate" on its own matched the
    # English verb 245 times in a 2,897-posting corpus ("articulate technical
    # tradeoffs to engineers"), which is a requirement in half the job market.
    - articulate storyline
    - articulate 360
    - storyline 360
    - cornerstone
    - scorm
    - lms administration
  enterprise:
    - conga
    - x-author
    - nuvolo
    - meddic
    - siebel
    - lotus notes
  ops:
    - data entry
    - ticket triage
    - mail merge
